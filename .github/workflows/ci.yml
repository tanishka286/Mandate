name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          npm run build:packages
          npm run test -w @mandate/api -- --exclude 'tests/integration/**/*hosted*.test.ts'
          npm run test -w @mandate/web
          npm run test -w @mandate/config
          npm run test -w @mandate/types
        env:
          NODE_ENV: test
          CI: true
          # Harmless CI placeholders — satisfy module init; not production credentials.
          PLANNING_REQUIREMENT_MODE: deterministic
          RAZORPAY_KEY_ID: rzp_test_ci_placeholder
          RAZORPAY_KEY_SECRET: ci_test_razorpay_secret_placeholder
          RAZORPAY_WEBHOOK_SECRET: ci_test_webhook_secret_placeholder
          RAZORPAY_ENV: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production

      - name: Build
        run: npm run build
